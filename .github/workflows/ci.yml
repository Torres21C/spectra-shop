name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, tipos, pruebas y build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://spectra_ci:spectra_ci@localhost:5432/spectra_ci?schema=catalog
      IDENTITY_DATABASE_URL: postgresql://spectra_ci:spectra_ci@localhost:5432/spectra_ci?schema=identity
      IDENTITY_ALLOW_EPHEMERAL_KEYS: 'true'
      COOKIE_SECURE: 'true'
      CORS_ORIGINS: https://127.0.0.1:5173
      POSTGRES_DB: spectra_ci
      POSTGRES_USER: spectra_ci
      POSTGRES_PASSWORD: spectra_ci
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_DB: spectra_ci
          POSTGRES_USER: spectra_ci
          POSTGRES_PASSWORD: spectra_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spectra_ci -d spectra_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
      - name: npm reproducible
        run: npm install --global npm@11.19.0
      - run: npm ci
      - name: Preparar credenciales efímeras de integración
        shell: bash
        run: |
          keys_dir="$RUNNER_TEMP/spectra-keys"
          mkdir -p "$keys_dir"
          openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256 -out "$keys_dir/private.pem"
          openssl pkey -in "$keys_dir/private.pem" -pubout -out "$keys_dir/public.pem"
          chmod 600 "$keys_dir/private.pem"
          chmod 644 "$keys_dir/public.pem"
          sudo chown 1000:1000 "$keys_dir/private.pem" "$keys_dir/public.pem"
          internal_token="$(openssl rand -hex 32)"
          inventory_token="$(openssl rand -hex 32)"
          echo "::add-mask::$internal_token"
          echo "::add-mask::$inventory_token"
          echo "SPECTRA_KEYS_DIR=$keys_dir" >> "$GITHUB_ENV"
          echo "SPECTRA_INTERNAL_TOKEN=$internal_token" >> "$GITHUB_ENV"
          echo "SPECTRA_INTERNAL_TOKENS=$internal_token" >> "$GITHUB_ENV"
          echo "CATALOG_INVENTORY_TOKEN=$inventory_token" >> "$GITHUB_ENV"
          echo "CATALOG_INVENTORY_TOKENS=$inventory_token" >> "$GITHUB_ENV"
      - name: Preparar PostgreSQL de integración
        run: |
          npm run prisma:generate --workspace @spectra/catalog-service
          npm run db:deploy --workspace @spectra/catalog-service
          npm run db:seed:dev --workspace @spectra/catalog-service
          npm run prisma:generate --workspace @spectra/identity-service
          npm run db:deploy --workspace @spectra/identity-service
          npm run db:seed:dev --workspace @spectra/identity-service
          npm run prisma:generate --workspace @spectra/commerce-service
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Integración M03/M04 distribuida y cobertura
        run: |
          docker compose --profile test up -d --build --wait postgres identity-service catalog-service
          docker compose --profile test build commerce-test
          docker compose --profile test run --rm --no-deps commerce-test sh -c \
            'npm run db:deploy --workspace @spectra/commerce-service && npm run test:cov --workspace @spectra/commerce-service'
      - name: Cerrar integración distribuida
        if: always()
        run: docker compose --profile test down --volumes
      - run: npm run build

  secrets:
    name: Secretos (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout completo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Validar las 14 reglas propias
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/src"
          semgrep/semgrep@sha256:cda1b566fafbf6010a02a3ea1d265b1c8eba4380e489a13891a102243d81ca6f
          semgrep --validate --metrics=off --config /src/security/semgrep
      - name: Probar reglas backend
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/src"
          semgrep/semgrep@sha256:cda1b566fafbf6010a02a3ea1d265b1c8eba4380e489a13891a102243d81ca6f
          semgrep --test --metrics=off
          --config /src/security/semgrep/spectra-backend.yaml
          /src/security/semgrep/spectra-backend.ts
      - name: Analizar código
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/src"
          semgrep/semgrep@sha256:cda1b566fafbf6010a02a3ea1d265b1c8eba4380e489a13891a102243d81ca6f
          semgrep scan --metrics=off
          --config /src/security/semgrep/spectra-backend.yaml
          --config /src/security/semgrep/spectra-frontend.yaml
          --severity ERROR --error
          --sarif --output /src/semgrep.sarif
          /src/apps /src/packages
      - name: Guardar reporte Semgrep
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: semgrep-report
          path: semgrep.sarif
          if-no-files-found: warn

  sca:
    name: SCA y SBOM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
      - name: npm reproducible
        run: npm install --global npm@11.19.0
      - run: npm ci
      - name: Auditoría de dependencias de producción
        run: npm audit --omit=dev --audit-level=high
      - name: SBOM CycloneDX
        run: npm exec -- cyclonedx-npm --output-file sbom.cdx.json
      - name: OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@1e54355a8b4c8abaa8cc7d0b70aa655a3bb15a6c
        env:
          JAVA_HOME: /opt/jdk
        with:
          project: spectra-shop
          path: .
          format: ALL
          args: >-
            --failOnCVSS 7
            --suppression .dependency-check/suppressions.xml
            --disableYarnAudit
      - name: Guardar reportes SCA
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: sca-reports
          path: |
            reports/
            sbom.cdx.json
          if-no-files-found: warn
