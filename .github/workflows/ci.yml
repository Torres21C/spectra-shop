name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, tipos, pruebas y build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
      - name: npm reproducible
        run: npm install --global npm@11.19.0
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  secrets:
    name: Secretos (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout completo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Validar las 14 reglas propias
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/src"
          semgrep/semgrep@sha256:cda1b566fafbf6010a02a3ea1d265b1c8eba4380e489a13891a102243d81ca6f
          semgrep --validate --metrics=off --config /src/security/semgrep
      - name: Probar reglas backend
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/src"
          semgrep/semgrep@sha256:cda1b566fafbf6010a02a3ea1d265b1c8eba4380e489a13891a102243d81ca6f
          semgrep --test --metrics=off
          --config /src/security/semgrep/spectra-backend.yaml
          /src/security/semgrep/spectra-backend.ts
      - name: Analizar código
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/src"
          semgrep/semgrep@sha256:cda1b566fafbf6010a02a3ea1d265b1c8eba4380e489a13891a102243d81ca6f
          semgrep scan --metrics=off
          --config /src/security/semgrep/spectra-backend.yaml
          --config /src/security/semgrep/spectra-frontend.yaml
          --severity ERROR --error
          --sarif --output /src/semgrep.sarif
          /src/apps /src/packages
      - name: Guardar reporte Semgrep
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: semgrep-report
          path: semgrep.sarif
          if-no-files-found: warn

  sca:
    name: SCA y SBOM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
      - name: npm reproducible
        run: npm install --global npm@11.19.0
      - run: npm ci
      - name: Auditoría de dependencias de producción
        run: npm audit --omit=dev --audit-level=high
      - name: SBOM CycloneDX
        run: npm exec -- cyclonedx-npm --output-file sbom.cdx.json
      - name: OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@1e54355a8b4c8abaa8cc7d0b70aa655a3bb15a6c
        env:
          JAVA_HOME: /opt/jdk
        with:
          project: spectra-shop
          path: .
          format: ALL
          args: >-
            --failOnCVSS 7
            --suppression .dependency-check/suppressions.xml
      - name: Guardar reportes SCA
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: sca-reports
          path: |
            reports/
            sbom.cdx.json
          if-no-files-found: warn
