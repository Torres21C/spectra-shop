name: spectra-shop

services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Define POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [backend]

  identity-service:
    build:
      context: .
      dockerfile: apps/identity-service/Dockerfile
    environment:
      PORT: '3001'
      IDENTITY_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=identity
      IDENTITY_ALLOW_EPHEMERAL_KEYS: 'true'
      COOKIE_SECURE: 'false'
      CORS_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
    ports: ['127.0.0.1:3001:3001']
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [edge, backend]

  identity-test:
    profiles: [test]
    build:
      context: .
      dockerfile: apps/identity-service/Dockerfile
      target: build
    environment:
      IDENTITY_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=identity
      IDENTITY_ALLOW_EPHEMERAL_KEYS: 'true'
      COOKIE_SECURE: 'true'
      CORS_ORIGINS: https://127.0.0.1:5173
    depends_on:
      postgres:
        condition: service_healthy
    command:
      [
        'sh',
        '-c',
        'npm run db:deploy --workspace @spectra/identity-service && npm run db:seed:dev --workspace @spectra/identity-service && npm test --workspace @spectra/identity-service',
      ]
    networks: [backend]

  catalog-service:
    build:
      context: .
      dockerfile: apps/catalog-service/Dockerfile
    environment:
      PORT: '3002'
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=catalog
      CORS_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
    ports: ['127.0.0.1:3002:3002']
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3002/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [edge, backend]

  catalog-test:
    profiles: [test]
    build:
      context: .
      dockerfile: apps/catalog-service/Dockerfile
      target: build
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=catalog
    depends_on:
      postgres:
        condition: service_healthy
    command:
      [
        'sh',
        '-c',
        'npm run db:deploy --workspace @spectra/catalog-service && npm run db:seed:dev --workspace @spectra/catalog-service && npm test --workspace @spectra/catalog-service',
      ]
    networks: [backend]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports: ['127.0.0.1:5173:5173']
    depends_on:
      identity-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:5173').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [edge]

  commerce-service:
    build:
      context: .
      dockerfile: apps/commerce-service/Dockerfile
    environment:
      PORT: '3003'
    ports: ['127.0.0.1:3003:3003']
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3003/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [edge, backend]

  audit-service:
    build:
      context: .
      dockerfile: apps/audit-service/Dockerfile
    environment:
      PORT: '3004'
    ports: ['127.0.0.1:3004:3004']
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3004/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [edge, backend]

networks:
  edge:
  backend:
    internal: true

volumes:
  postgres-data:
