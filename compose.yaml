name: spectra-shop

services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Define POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [backend]

  # DT-09 (M06.0): POSTGRES_USER es solo el administrador del clúster. Este job crea los roles de
  # migración y de ejecución de cada servicio, transfiere la propiedad de cada esquema a su migrador y
  # retira privilegios de PUBLIC. Es idempotente y no borra datos.
  # AWS-03: imagen db-ops (infra/postgres/Dockerfile) con los scripts dentro; la misma que se ejecuta en
  # ECS con `run-task`. Sin bind mounts del host.
  postgres-provision:
    build:
      context: infra/postgres
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:?Define POSTGRES_DB in .env}
      PGUSER: ${POSTGRES_USER:?Define POSTGRES_USER in .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}
      SPECTRA_IDENTITY_MIGRATOR_PASSWORD: ${SPECTRA_IDENTITY_MIGRATOR_PASSWORD:?Define SPECTRA_IDENTITY_MIGRATOR_PASSWORD in .env}
      SPECTRA_IDENTITY_APP_PASSWORD: ${SPECTRA_IDENTITY_APP_PASSWORD:?Define SPECTRA_IDENTITY_APP_PASSWORD in .env}
      SPECTRA_CATALOG_MIGRATOR_PASSWORD: ${SPECTRA_CATALOG_MIGRATOR_PASSWORD:?Define SPECTRA_CATALOG_MIGRATOR_PASSWORD in .env}
      SPECTRA_CATALOG_APP_PASSWORD: ${SPECTRA_CATALOG_APP_PASSWORD:?Define SPECTRA_CATALOG_APP_PASSWORD in .env}
      SPECTRA_COMMERCE_MIGRATOR_PASSWORD: ${SPECTRA_COMMERCE_MIGRATOR_PASSWORD:?Define SPECTRA_COMMERCE_MIGRATOR_PASSWORD in .env}
      SPECTRA_COMMERCE_APP_PASSWORD: ${SPECTRA_COMMERCE_APP_PASSWORD:?Define SPECTRA_COMMERCE_APP_PASSWORD in .env}
      SPECTRA_AUDIT_MIGRATOR_PASSWORD: ${SPECTRA_AUDIT_MIGRATOR_PASSWORD:?Define SPECTRA_AUDIT_MIGRATOR_PASSWORD in .env}
      SPECTRA_AUDIT_APP_PASSWORD: ${SPECTRA_AUDIT_APP_PASSWORD:?Define SPECTRA_AUDIT_APP_PASSWORD in .env}
    command:
      ['psql', '-X', '-q', '-v', 'ON_ERROR_STOP=1', '-f', '/provision/provision-service-roles.sql']
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    networks: [backend]

  identity-migrate:
    build:
      context: .
      dockerfile: apps/identity-service/Dockerfile
    environment:
      IDENTITY_DATABASE_URL: postgresql://spectra_identity_migrator:${SPECTRA_IDENTITY_MIGRATOR_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=identity
      # M06 mínimo: ADMIN sintético opcional (el seed solo inserta; nunca hay registro público de ADMIN).
      SYNTHETIC_ADMIN_EMAIL: ${SYNTHETIC_ADMIN_EMAIL:-}
      SYNTHETIC_ADMIN_PASSWORD: ${SYNTHETIC_ADMIN_PASSWORD:-}
    command:
      [
        'sh',
        '-c',
        './node_modules/.bin/prisma migrate deploy --schema prisma/schema.prisma && ./node_modules/.bin/prisma db execute --schema prisma/schema.prisma --file prisma/runtime-grants.sql && node dist/database/seed.js',
      ]
    depends_on:
      postgres-provision:
        condition: service_completed_successfully
    restart: 'no'
    networks: [backend]

  identity-service:
    build:
      context: .
      dockerfile: apps/identity-service/Dockerfile
    environment:
      PORT: '3001'
      INTERNAL_PORT: '3101'
      IDENTITY_DATABASE_URL: postgresql://spectra_identity_app:${SPECTRA_IDENTITY_APP_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=identity
      IDENTITY_ALLOW_EPHEMERAL_KEYS: 'false'
      IDENTITY_PRIVATE_KEY_PATH: /run/spectra-keys/private.pem
      IDENTITY_PUBLIC_KEY_PATH: /run/spectra-keys/public.pem
      SPECTRA_INTERNAL_TOKENS: ${SPECTRA_INTERNAL_TOKENS:?Define SPECTRA_INTERNAL_TOKENS in .env}
      COOKIE_SECURE: 'false'
      CORS_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
    depends_on:
      postgres-finalize:
        condition: service_completed_successfully
    ports: ['127.0.0.1:3001:3001']
    volumes:
      - ${SPECTRA_KEYS_DIR:?Define SPECTRA_KEYS_DIR in .env}/private.pem:/run/spectra-keys/private.pem:ro
      - ${SPECTRA_KEYS_DIR:?Define SPECTRA_KEYS_DIR in .env}/public.pem:/run/spectra-keys/public.pem:ro
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [edge, backend]

  identity-test:
    profiles: [test]
    build:
      context: .
      dockerfile: apps/identity-service/Dockerfile
      target: build
    environment:
      IDENTITY_DATABASE_URL: postgresql://spectra_identity_app:${SPECTRA_IDENTITY_APP_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=identity
      IDENTITY_FIXTURE_DATABASE_URL: postgresql://spectra_identity_migrator:${SPECTRA_IDENTITY_MIGRATOR_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=identity
      IDENTITY_ALLOW_EPHEMERAL_KEYS: 'true'
      SPECTRA_INTERNAL_TOKENS: ${SPECTRA_INTERNAL_TOKENS:?Define SPECTRA_INTERNAL_TOKENS in .env}
      COOKIE_SECURE: 'true'
      CORS_ORIGINS: https://127.0.0.1:5173
    depends_on:
      postgres-finalize:
        condition: service_completed_successfully
    command: ['npm', 'test', '--workspace', '@spectra/identity-service']
    networks: [backend]

  catalog-migrate:
    build:
      context: .
      dockerfile: apps/catalog-service/Dockerfile
    environment:
      DATABASE_URL: postgresql://spectra_catalog_migrator:${SPECTRA_CATALOG_MIGRATOR_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=catalog
    command:
      [
        'sh',
        '-c',
        './node_modules/.bin/prisma migrate deploy --schema prisma/schema.prisma && ./node_modules/.bin/prisma db execute --schema prisma/schema.prisma --file prisma/runtime-grants.sql && node dist/database/seed.js',
      ]
    depends_on:
      postgres-provision:
        condition: service_completed_successfully
    restart: 'no'
    networks: [backend]

  catalog-service:
    build:
      context: .
      dockerfile: apps/catalog-service/Dockerfile
    environment:
      PORT: '3002'
      INTERNAL_PORT: '3102'
      DATABASE_URL: postgresql://spectra_catalog_app:${SPECTRA_CATALOG_APP_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=catalog
      SPECTRA_INTERNAL_TOKENS: ${SPECTRA_INTERNAL_TOKENS:?Define SPECTRA_INTERNAL_TOKENS in .env}
      CATALOG_INVENTORY_TOKENS: ${CATALOG_INVENTORY_TOKENS:?Define CATALOG_INVENTORY_TOKENS in .env}
      CORS_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
      # M06/M07 mínimo: alta de productos para ADMIN y relay de la outbox hacia audit-service.
      IDENTITY_INTERNAL_URL: http://identity-service:3101
      IDENTITY_PUBLIC_KEY_PATH: /run/spectra-keys/public.pem
      SPECTRA_INTERNAL_TOKEN: ${SPECTRA_INTERNAL_TOKEN:?Define SPECTRA_INTERNAL_TOKEN in .env}
      AUDIT_INTERNAL_URL: http://audit-service:3104
      COOKIE_SECURE: 'false'
    depends_on:
      postgres-finalize:
        condition: service_completed_successfully
    ports: ['127.0.0.1:3002:3002']
    volumes:
      - ${SPECTRA_KEYS_DIR:?Define SPECTRA_KEYS_DIR in .env}/public.pem:/run/spectra-keys/public.pem:ro
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3002/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [edge, backend]

  catalog-test:
    profiles: [test]
    build:
      context: .
      dockerfile: apps/catalog-service/Dockerfile
      target: build
    environment:
      DATABASE_URL: postgresql://spectra_catalog_app:${SPECTRA_CATALOG_APP_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=catalog
      CATALOG_FIXTURE_DATABASE_URL: postgresql://spectra_catalog_migrator:${SPECTRA_CATALOG_MIGRATOR_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=catalog
      SPECTRA_INTERNAL_TOKENS: ${SPECTRA_INTERNAL_TOKENS:?Define SPECTRA_INTERNAL_TOKENS in .env}
      CATALOG_INVENTORY_TOKENS: ${CATALOG_INVENTORY_TOKENS:?Define CATALOG_INVENTORY_TOKENS in .env}
      # M07 mínimo: las pruebas invocan el relay explícitamente (sin temporizador).
      AUDIT_RELAY_INTERVAL_MS: '0'
    depends_on:
      postgres-finalize:
        condition: service_completed_successfully
    command: ['npm', 'test', '--workspace', '@spectra/catalog-service']
    networks: [backend]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports: ['127.0.0.1:5173:5173']
    depends_on:
      identity-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      commerce-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:5173').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [edge]

  commerce-migrate:
    build:
      context: .
      dockerfile: apps/commerce-service/Dockerfile
    environment:
      COMMERCE_DATABASE_URL: postgresql://spectra_commerce_migrator:${SPECTRA_COMMERCE_MIGRATOR_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=commerce
    command:
      [
        'sh',
        '-c',
        './node_modules/.bin/prisma migrate deploy --schema prisma/schema.prisma && ./node_modules/.bin/prisma db execute --schema prisma/schema.prisma --file prisma/runtime-grants.sql',
      ]
    depends_on:
      postgres-provision:
        condition: service_completed_successfully
    restart: 'no'
    networks: [backend]

  # M07 mínimo: esquema `audit` con su rol migrador; el runtime solo recibe INSERT y SELECT.
  audit-migrate:
    build:
      context: .
      dockerfile: apps/audit-service/Dockerfile
    environment:
      AUDIT_DATABASE_URL: postgresql://spectra_audit_migrator:${SPECTRA_AUDIT_MIGRATOR_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=audit
    command:
      [
        'sh',
        '-c',
        './node_modules/.bin/prisma migrate deploy --schema prisma/schema.prisma && ./node_modules/.bin/prisma db execute --schema prisma/schema.prisma --file prisma/runtime-grants.sql',
      ]
    depends_on:
      postgres-provision:
        condition: service_completed_successfully
    restart: 'no'
    networks: [backend]

  # DT-09: cierra la ventana de migración (revoca CREATE sobre la base a los migradores) antes de
  # arrancar cualquier servicio.
  postgres-finalize:
    build:
      context: infra/postgres
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:?Define POSTGRES_DB in .env}
      PGUSER: ${POSTGRES_USER:?Define POSTGRES_USER in .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}
    command:
      ['psql', '-X', '-q', '-v', 'ON_ERROR_STOP=1', '-f', '/provision/finalize-service-roles.sql']
    depends_on:
      identity-migrate:
        condition: service_completed_successfully
      catalog-migrate:
        condition: service_completed_successfully
      commerce-migrate:
        condition: service_completed_successfully
      audit-migrate:
        condition: service_completed_successfully
    restart: 'no'
    networks: [backend]

  commerce-service:
    build:
      context: .
      dockerfile: apps/commerce-service/Dockerfile
    environment:
      PORT: '3003'
      COMMERCE_DATABASE_URL: postgresql://spectra_commerce_app:${SPECTRA_COMMERCE_APP_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=commerce
      CATALOG_INTERNAL_URL: http://catalog-service:3102
      IDENTITY_INTERNAL_URL: http://identity-service:3101
      IDENTITY_PUBLIC_KEY_PATH: /run/spectra-keys/public.pem
      SPECTRA_INTERNAL_TOKEN: ${SPECTRA_INTERNAL_TOKEN:?Define SPECTRA_INTERNAL_TOKEN in .env}
      CATALOG_INVENTORY_TOKEN: ${CATALOG_INVENTORY_TOKEN:?Define CATALOG_INVENTORY_TOKEN in .env}
      COOKIE_SECURE: 'false'
      CORS_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
    depends_on:
      postgres-finalize:
        condition: service_completed_successfully
      identity-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
    ports: ['127.0.0.1:3003:3003']
    volumes:
      - ${SPECTRA_KEYS_DIR:?Define SPECTRA_KEYS_DIR in .env}/public.pem:/run/spectra-keys/public.pem:ro
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3003/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [edge, backend]

  commerce-test:
    profiles: [test]
    build:
      context: .
      dockerfile: apps/commerce-service/Dockerfile
      target: build
    environment:
      COMMERCE_DATABASE_URL: postgresql://spectra_commerce_app:${SPECTRA_COMMERCE_APP_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=commerce
      # DT-09: los fixtures usan los migradores; nunca el rol de ejecución de otro servicio.
      COMMERCE_FIXTURE_DATABASE_URL: postgresql://spectra_commerce_migrator:${SPECTRA_COMMERCE_MIGRATOR_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=commerce
      CATALOG_TEST_DATABASE_URL: postgresql://spectra_catalog_migrator:${SPECTRA_CATALOG_MIGRATOR_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=catalog
      IDENTITY_TEST_DATABASE_URL: postgresql://spectra_identity_migrator:${SPECTRA_IDENTITY_MIGRATOR_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=identity
      CATALOG_INTERNAL_URL: http://catalog-service:3102
      IDENTITY_INTERNAL_URL: http://identity-service:3101
      IDENTITY_PUBLIC_KEY_PATH: /run/spectra-keys/public.pem
      IDENTITY_TEST_PRIVATE_KEY_PATH: /run/test-keys/private.pem
      SPECTRA_INTERNAL_TOKEN: ${SPECTRA_INTERNAL_TOKEN:?Define SPECTRA_INTERNAL_TOKEN in .env}
      CATALOG_INVENTORY_TOKEN: ${CATALOG_INVENTORY_TOKEN:?Define CATALOG_INVENTORY_TOKEN in .env}
      COOKIE_SECURE: 'false'
      CORS_ORIGINS: http://127.0.0.1:5173
    volumes:
      - ${SPECTRA_KEYS_DIR:?Define SPECTRA_KEYS_DIR in .env}/public.pem:/run/spectra-keys/public.pem:ro
      - ${SPECTRA_KEYS_DIR:?Define SPECTRA_KEYS_DIR in .env}/private.pem:/run/test-keys/private.pem:ro
    depends_on:
      postgres-finalize:
        condition: service_completed_successfully
      identity-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
    command: ['npm', 'test', '--workspace', '@spectra/commerce-service']
    networks: [backend]

  # DT-09: matriz de privilegios efectivos (positivos y negativos) con los seis roles de servicio.
  db-isolation-test:
    profiles: [test]
    build:
      context: .
      dockerfile: apps/commerce-service/Dockerfile
      target: build
    environment:
      IDENTITY_APP_URL: postgresql://spectra_identity_app:${SPECTRA_IDENTITY_APP_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=identity
      IDENTITY_MIGRATOR_URL: postgresql://spectra_identity_migrator:${SPECTRA_IDENTITY_MIGRATOR_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=identity
      CATALOG_APP_URL: postgresql://spectra_catalog_app:${SPECTRA_CATALOG_APP_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=catalog
      CATALOG_MIGRATOR_URL: postgresql://spectra_catalog_migrator:${SPECTRA_CATALOG_MIGRATOR_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=catalog
      COMMERCE_APP_URL: postgresql://spectra_commerce_app:${SPECTRA_COMMERCE_APP_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=commerce
      COMMERCE_MIGRATOR_URL: postgresql://spectra_commerce_migrator:${SPECTRA_COMMERCE_MIGRATOR_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=commerce
      AUDIT_APP_URL: postgresql://spectra_audit_app:${SPECTRA_AUDIT_APP_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=audit
      AUDIT_MIGRATOR_URL: postgresql://spectra_audit_migrator:${SPECTRA_AUDIT_MIGRATOR_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=audit
    volumes:
      - ./scripts/verify-db-isolation.mjs:/workspace/scripts/verify-db-isolation.mjs:ro
    depends_on:
      postgres-finalize:
        condition: service_completed_successfully
    command: ['node', 'scripts/verify-db-isolation.mjs']
    networks: [backend]

  audit-service:
    build:
      context: .
      dockerfile: apps/audit-service/Dockerfile
    environment:
      PORT: '3004'
      # M07 mínimo: la ingesta interna (3104) solo existe en la red privada; no se publica al host.
      INTERNAL_PORT: '3104'
      AUDIT_DATABASE_URL: postgresql://spectra_audit_app:${SPECTRA_AUDIT_APP_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=audit
      IDENTITY_INTERNAL_URL: http://identity-service:3101
      IDENTITY_PUBLIC_KEY_PATH: /run/spectra-keys/public.pem
      SPECTRA_INTERNAL_TOKEN: ${SPECTRA_INTERNAL_TOKEN:?Define SPECTRA_INTERNAL_TOKEN in .env}
      SPECTRA_INTERNAL_TOKENS: ${SPECTRA_INTERNAL_TOKENS:?Define SPECTRA_INTERNAL_TOKENS in .env}
      COOKIE_SECURE: 'false'
      CORS_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
    depends_on:
      postgres-finalize:
        condition: service_completed_successfully
    volumes:
      - ${SPECTRA_KEYS_DIR:?Define SPECTRA_KEYS_DIR in .env}/public.pem:/run/spectra-keys/public.pem:ro
    ports: ['127.0.0.1:3004:3004']
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3004/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [edge, backend]

  # M07 mínimo: pruebas de integración de audit-service contra PostgreSQL con el rol de ejecución.
  audit-test:
    profiles: [test]
    build:
      context: .
      dockerfile: apps/audit-service/Dockerfile
      target: build
    environment:
      AUDIT_DATABASE_URL: postgresql://spectra_audit_app:${SPECTRA_AUDIT_APP_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=audit
      AUDIT_FIXTURE_DATABASE_URL: postgresql://spectra_audit_migrator:${SPECTRA_AUDIT_MIGRATOR_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=audit
      SPECTRA_INTERNAL_TOKENS: ${SPECTRA_INTERNAL_TOKENS:?Define SPECTRA_INTERNAL_TOKENS in .env}
    depends_on:
      postgres-finalize:
        condition: service_completed_successfully
    command: ['npm', 'test', '--workspace', '@spectra/audit-service']
    networks: [backend]

networks:
  edge:
  backend:
    internal: true

volumes:
  postgres-data:
